<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYRVIS · 桌面伙伴</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#203a57;background:#eef3f8}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #2f75cb;outline-offset:5px}header{padding:28px 5vw;display:flex;align-items:center;justify-content:space-between}header strong{font-size:15px;letter-spacing:3px}header span{font-size:12px;color:#59718b}main{max-width:1240px;margin:auto;padding:20px 32px 40px}.intro{display:flex;justify-content:space-between;align-items:end;margin:15px 0 26px}h1{font-size:36px;letter-spacing:-1px;margin:0 0 10px}p{color:#5a7088;line-height:1.7;margin:0}.intro small{max-width:230px;color:#617790;line-height:1.7}.desktop{height:490px;position:relative;overflow:hidden;background:linear-gradient(130deg,#dbe8f3,#f8fafc 52%,#d8e5f4);border:1px solid #fff;border-radius:24px;box-shadow:0 22px 55px #47658512}.wallpaper{position:absolute;width:600px;height:600px;right:-70px;top:220px;border-radius:50%;border:90px solid #bdcfe04d}.clock{position:absolute;left:38px;top:35px;font-size:54px;letter-spacing:-3px;font-weight:200}.clock small{display:block;font-size:13px;letter-spacing:1px;margin-top:7px;color:#59718b}.note{position:absolute;left:39px;top:158px;font-size:14px;color:#688099;line-height:1.8}.companion{position:absolute;right:100px;bottom:28px;width:250px;height:300px;padding:0;border:0;background:none;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}.companion:active{cursor:grabbing}.robot{width:100%;height:100%;overflow:visible}.whole{transform-origin:200px 380px;animation:breathe 3.8s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}.state-sleeping .whole{animation-duration:6s}.state-sleeping .eyes,.state-speaking .eyes{animation:none}.state-thinking .head{transform-box:view-box;transform-origin:200px 230px;animation:ponder 4s ease-in-out infinite}.state-speaking .arm-right{transform-box:view-box;transform-origin:269px 285px;animation:wave 1.2s ease-in-out infinite alternate}.bubble{position:absolute;right:70px;bottom:344px;max-width:310px;padding:17px 22px;background:#ffffffec;border-radius:20px 20px 5px 20px;box-shadow:0 8px 26px #36557510;font-size:15px;line-height:1.6}.status{position:absolute;left:38px;bottom:32px;display:flex;align-items:center;gap:9px;font-size:13px;color:#506c88}.dot{width:7px;height:7px;border-radius:50%;background:#5e9ede}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}.controls button,.demo{border:1px solid #cad8e5;padding:11px 19px;border-radius:24px;color:#45617e;background:#ffffff70;font-size:14px}.controls button[aria-pressed=true]{color:white;background:#285f9f;border-color:#285f9f}.demo{background:#203e60;color:white;margin-left:auto}.hint{margin-top:15px;font-size:12px;color:#667d94}.legend{display:flex;justify-content:space-between;gap:22px;margin-top:28px;padding-top:23px;border-top:1px solid #d5e0eb;font-size:13px;color:#5c748e}.legend strong{color:#2b4766;font-weight:500;display:block;margin-bottom:6px}@keyframes breathe{50%{transform:translateY(-4px)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@keyframes ponder{0%,100%{transform:rotate(2deg)}50%{transform:rotate(4deg)}}@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(-28deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:650px){header{padding:22px}.intro{display:block}h1{font-size:29px}.intro small{display:block;margin-top:12px}main{padding:10px 18px 30px}.desktop{height:470px}.companion{right:25px;width:220px;height:264px;bottom:35px}.bubble{right:20px;bottom:300px;max-width:220px}.clock{font-size:34px;left:23px;top:24px}.note{display:none}.status{left:23px;bottom:19px}.demo{margin-left:0}.legend{flex-wrap:wrap}.intro p{font-size:14px}}
</style><header><strong>CYRVIS</strong><span>桌面角色 · 交互概念</span></header><main><div class="intro"><div><h1>一个会回应你的桌面小伙伴。</h1><p>叫醒它，看它听你说话，再替你行动。</p></div><small>点击小机器人唤醒或休息，<br>也可以拖动它换个位置。</small></div><section class="desktop" aria-label="桌面效果预览"><div class="wallpaper"></div><div class="clock">09:41<small>A LITTLE COMPANY.</small></div><div class="note">把空间留给你的工作。<br>需要时，它就在这里。</div><div class="bubble" role="status" aria-live="polite">我在。有什么可以帮你？</div><button class="companion" aria-label="唤醒 CYRVIS"></button><div class="status"><i class="dot"></i><span id="status">陪伴 · 安静地等你开口</span></div></section><div class="controls" aria-label="切换角色状态"></div><p class="hint">这是动作与表情演示，未开启麦克风，也不会执行真实任务。</p><div class="legend"><div><strong>形象</strong>陶瓷白机身、蓝色侧耳、分段 C 胸标</div><div><strong>沟通</strong>语音为主，短气泡只呈现当前一句</div><div><strong>陪伴</strong>轻呼吸与眨眼，休息时闭眼、保持安静</div></div></main><script>
const states=/*STATE_DATA*/;
const companion=document.querySelector('.companion'),bubble=document.querySelector('.bubble'),controls=document.querySelector('.controls');
const replies={idle:'我在。有什么可以帮你？',listening:'嗯，我在听。',thinking:'让我想一想怎么安排。',speaking:'可以，我来帮你。',working:'正在整理，你可以继续忙。',sleeping:'需要我时，再叫醒我。'};
let current='idle',timers=[];
function stopDemo(){timers.forEach(clearTimeout);timers=[];const b=document.querySelector('.demo');if(b)b.textContent='播放沟通过程';}
function setState(s){current=s;companion.innerHTML=states[s].svg;bubble.textContent=replies[s];document.querySelector('#status').textContent=states[s].label+' · '+states[s].description;companion.setAttribute('aria-label',s==='sleeping'?'唤醒 CYRVIS':'与 CYRVIS 互动');document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===s)));}
for(const [s,v] of Object.entries(states)){const b=document.createElement('button');b.textContent=v.label;b.dataset.state=s;b.setAttribute('aria-pressed','false');b.onclick=()=>{stopDemo();setState(s)};controls.append(b);}
const demo=document.createElement('button');demo.className='demo';demo.textContent='播放沟通过程';controls.append(demo);demo.onclick=()=>{if(timers.length){stopDemo();return}demo.textContent='停止演示';['listening','thinking','speaking','working','idle'].forEach((s,i)=>timers.push(setTimeout(()=>{setState(s);if(i===4)stopDemo()},i*2300)))};
let drag=null,suppressClick=false;
companion.addEventListener('pointerdown',e=>{if(e.button!==0)return;const r=companion.getBoundingClientRect(),p=companion.parentElement.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left-p.left,top:r.top-p.top,moved:false};companion.setPointerCapture(e.pointerId)});
companion.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(!drag.moved)return;const parent=companion.parentElement;companion.style.right='auto';companion.style.bottom='auto';companion.style.left=Math.min(Math.max(0,drag.left+dx),parent.clientWidth-companion.offsetWidth)+'px';companion.style.top=Math.min(Math.max(0,drag.top+dy),parent.clientHeight-companion.offsetHeight)+'px'});
companion.addEventListener('pointerup',()=>{suppressClick=!!drag?.moved;drag=null});companion.addEventListener('pointercancel',()=>{drag=null;suppressClick=false});companion.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}stopDemo();setState(current==='sleeping'||current==='idle'?'listening':'sleeping')});
window.addEventListener('resize',()=>{companion.style.left='';companion.style.top='';companion.style.right='';companion.style.bottom=''});setState('idle');
</script></html>
